name: Desktop build

on:
  push:
    branches:
      - main
      - codex/desktop-clients
  pull_request:
    branches:
      - main
      - codex/desktop-clients
  workflow_dispatch:

# This workflow only reads source and uploads short-lived workflow artifacts.
# It never creates releases, uploads release assets, or deploys to a VM.
permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            label: Windows x64
            artifact: windows-x64
            bundles: nsis,msi
            artifact_paths: |
              desktop/src-tauri/target/release/bundle/nsis/*.exe
              desktop/src-tauri/target/release/bundle/msi/*.msi
          - os: ubuntu-22.04
            label: Ubuntu 22.04 x64
            artifact: linux-x64
            bundles: deb,appimage
            artifact_paths: |
              desktop/src-tauri/target/release/bundle/deb/*.deb
              desktop/src-tauri/target/release/bundle/appimage/*.AppImage

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js 24.22.1
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Rust stable
        id: rust-toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Show toolchain versions
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version

      - name: Cache Cargo dependencies and build outputs
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ steps.rust-toolchain.outputs.cachekey }}-

      - name: Cache Tauri downloads (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/tauri
          key: linux-tauri-downloads-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}

      - name: Cache Tauri downloads (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~\AppData\Local\tauri
          key: windows-tauri-downloads-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}

      - name: Install Linux bundling dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Test frontend state and validation
        working-directory: desktop
        run: node --test tests/model.test.mjs

      - name: Set up Python for RPC contract tests
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Test desktop RPC boundaries
        run: python -m unittest discover -s tests -p test_desktop_remote.py -v

      - name: Test Windows engine contracts (PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & ./tests/local_hyperv_test.ps1
          & ./tests/local_iso_test.ps1

      - name: Type-check and build frontend
        working-directory: desktop
        run: npm run build

      - name: Test Rust core
        working-directory: desktop/src-tauri
        run: cargo test --locked

      - name: Build native installers
        working-directory: desktop
        run: npm run tauri -- build --bundles "${{ matrix.bundles }}"

      - name: Upload native installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: virtops-desktop-${{ matrix.artifact }}-${{ github.sha }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          retention-days: 14
